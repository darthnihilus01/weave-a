[package]
name = "weave_validator"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "weave_validator"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29.0", features = ["extension-module"] }
sqlparser = "0.63.0"
tree-sitter = "0.22.6"
tree-sitter-kotlin = "0.3.8"
